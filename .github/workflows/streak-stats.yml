name: Update GitHub Contribution Streak

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/streak-stats.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate contribution streak SVG
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=argavthakur-maker&theme=tokyonight&hide_border=true&ring=E11D48&fire=FB7185&currStreakLabel=FB7185
          path: profile/streak.svg

      - name: Commit updated streak card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git diff --cached --quiet || git commit -m "chore: refresh GitHub contribution streak"
          git push
